name: 음성 팩 만들기

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/tts/gen_pack.py"
      - ".github/workflows/voice-pack.yml"

permissions:
  contents: write

jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 설치
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          pip install supertonic soundfile numpy
      - name: 소리 만들기
        run: python scripts/tts/gen_pack.py voice
      - name: 묶기
        run: |
          du -sh voice; find voice -name "*.ogg" | wc -l
          zip -qr voice-pack.zip voice
          ls -la voice-pack.zip
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: voice-pack
          name: 음성 팩 (앱 빌드에 들어가는 소리)
          body: Supertonic F1 목소리로 만든 금액·문장·계산 문제 소리. APK 빌드 때 자동으로 들어가요.
          files: voice-pack.zip
          make_latest: false
