name: 음성 팩 일부 다시 만들기

# 끊어 읽는 금액(n), 상품 하나 문장(질문 추가), 바뀐 단어만 새로 만들어 지금 음성 팩에 덮어씀
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  part:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 설치
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          pip install supertonic faster-whisper soundfile numpy
      - name: 소리 만들고 받아 적어 검사하기
        run: python scripts/tts/gen_pack.py voice update ${{ matrix.shard }} 6
      - uses: actions/upload-artifact@v4
        with:
          name: part-${{ matrix.shard }}
          path: |
            voice
            report

  pack:
    needs: part
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: parts
      - name: 지금 음성 팩에 덮어쓰기
        run: |
          gh release download voice-pack -R ${{ github.repository }} -p voice-pack.zip -D old
          unzip -q old/voice-pack.zip
          mkdir -p report
          for d in parts/part-*; do cp -r $d/voice/. voice/; cp -r $d/report/. report/; done
          python3 - <<'PY'
          import json,glob
          import os,shutil,sys
          sys.argv=["x","dry"];sys.path.insert(0,"scripts/tts")
          import gen_pack as g
          ix=json.load(open("voice/index.json"));ix["nat"]=True;ix["natS"]=True
          vs={v for l in ix["money"].values() for v in l}
          cp=0
          for v in vs:
              if len(g.natural_parts(v))==1 and not os.path.exists(f"voice/m/{v}_n.ogg"):
                  shutil.copy(f"voice/m/{v}_s.ogg",f"voice/m/{v}_n.ogg");cp+=1
          miss=[v for v in vs if not os.path.exists(f"voice/m/{v}_n.ogg")]
          print(f"::notice::그대로 복사 {cp}개, 빠진 것 {len(miss)}개")
          ix["words"]=[c["id"] for c in json.load(open("www/cards/cards.json"))]
          json.dump(ix,open("voice/index.json","w"),ensure_ascii=False,separators=(",",":"))
          rs=[r for f in glob.glob("report/*.json") for r in json.load(open(f))]
          bad=[r for r in rs if not r["ok"]]
          print(f"::notice::새로 만든 것 {len(rs)}개, 다시 만든 것 {sum(r['tries']>1 for r in rs)}개, 끝까지 검사 실패 {len(bad)}개")
          for r in bad: print("FAIL", r["name"], "|", r["text"], "→", r["heard"])
          json.dump(bad,open("voice-update-failures.json","w"),ensure_ascii=False,indent=1)
          PY
          find voice -name "*_n.ogg" | wc -l
          zip -qr voice-pack.zip voice
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: voice-pack
          files: |
            voice-pack.zip
            voice-update-failures.json
          make_latest: false
