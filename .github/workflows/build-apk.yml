name: APK 빌드

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: 패키지 설치
        run: npm ci

      - name: 웹 코드를 안드로이드 프로젝트에 복사
        run: npx cap sync android

      - name: APK 만들기
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: 파일 이름 정리
        run: cp android/app/build/outputs/apk/release/app-release.apk listen-money-${{ github.run_number }}.apk

      - name: 실행 결과에 APK 올리기
        uses: actions/upload-artifact@v4
        with:
          name: listen-money-apk
          path: listen-money-${{ github.run_number }}.apk

      - name: 릴리스 페이지에 APK 올리기 (폰에서 바로 받기용)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: 듣고 금액 쓰기 1.0.${{ github.run_number }}
          files: listen-money-${{ github.run_number }}.apk
          make_latest: true
