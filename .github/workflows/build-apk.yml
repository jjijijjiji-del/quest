name: APK 빌드

on:
  push:
    branches: [main]
    paths-ignore:
      - "scripts/tts/**"
      - ".github/workflows/tts-samples.yml"
      - ".github/workflows/voice-pack.yml"
      - ".github/workflows/voice-repair.yml"
      - ".github/workflows/voice-update.yml"
  workflow_dispatch:
  workflow_run:
    workflows: ["음성 팩 만들기", "음성 팩 고치기", "음성 팩 단어 추가", "음성 팩 일부 다시 만들기"]
    types: [completed]

permissions:
  contents: write

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: 패키지 설치
        run: npm ci

      - name: 음성 팩 넣기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release download voice-pack -R ${{ github.repository }} -p voice-pack.zip -D /tmp; then
            rm -rf www/voice && unzip -q /tmp/voice-pack.zip -d www && du -sh www/voice
          else
            echo "음성 팩이 아직 없어요 (기계 음성으로 동작)"
          fi

      - name: 보호자 녹음 넣기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release download voice-pack -R ${{ github.repository }} -p human-voice.zip -D /tmp; then
            command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null)
            python3 scripts/bake_hvoice.py /tmp/human-voice.zip www/hvoice && du -sh www/hvoice
          else
            echo "보호자 녹음 묶음이 아직 없어요"
          fi

      - name: 웹 코드를 안드로이드 프로젝트에 복사
        run: |
          cp node_modules/@capacitor/core/dist/capacitor.js www/capacitor.js
          npx cap sync android

      - name: APK 만들기
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: 파일 이름 정리
        run: cp android/app/build/outputs/apk/release/app-release.apk listen-money-${{ github.run_number }}.apk

      - name: 실행 결과에 APK 올리기
        uses: actions/upload-artifact@v4
        with:
          name: listen-money-apk
          path: listen-money-${{ github.run_number }}.apk

      - name: 릴리스 페이지에 APK 올리기 (폰에서 바로 받기용)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: 듣고 금액 쓰기 1.0.${{ github.run_number }}
          files: listen-money-${{ github.run_number }}.apk
          make_latest: true
