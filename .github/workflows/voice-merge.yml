name: 음성 팩 합치기

# 이미 나눠 만든 결과(다른 실행의 part-* 아티팩트)를 합쳐 음성 팩으로 올림
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "나눠 만든 '음성 팩 만들기' 실행 번호"
        required: true

permissions:
  contents: write
  actions: read

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: parts
          pattern: part-*
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - name: 합치기
        run: |
          mkdir -p voice report
          for d in parts/part-*; do cp -r $d/voice/. voice/; cp -r $d/report/. report/; done
          python3 scripts/tts/gen_pack.py voice index
          find voice -name "*.ogg" | wc -l; du -sh voice
          python3 - <<'PY'
          import json,glob
          rs=[r for f in glob.glob("report/*.json") for r in json.load(open(f))]
          bad=[r for r in rs if not r["ok"]]
          print(f"::notice::전체 {len(rs)}개, 다시 만든 것 {sum(r['tries']>1 for r in rs)}개, 끝까지 검사 실패 {len(bad)}개")
          for r in bad: print("FAIL", r["name"], "|", r["text"], "→", r["heard"])
          json.dump(bad,open("voice-check-failures.json","w"),ensure_ascii=False,indent=1)
          json.dump(rs,open("voice-check-all.json","w"),ensure_ascii=False)
          PY
          zip -qr voice-pack.zip voice
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: voice-pack
          files: |
            voice-pack.zip
            voice-check-failures.json
            voice-check-all.json
          make_latest: false
