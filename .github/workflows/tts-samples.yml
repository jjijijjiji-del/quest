name: 음성 샘플 만들기

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/tts/**"
      - ".github/workflows/tts-samples.yml"

permissions:
  contents: write

jobs:
  supertonic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 설치
        run: pip install supertonic soundfile numpy
      - name: 샘플 만들기
        run: python scripts/tts/samples.py supertonic
      - name: mp3로 바꾸기
        run: |
          sudo apt-get install -y ffmpeg >/dev/null
          for f in samples/*.wav; do ffmpeg -loglevel error -y -i "$f" -b:a 128k "${f%.wav}.mp3"; done
      - uses: actions/upload-artifact@v4
        with:
          name: supertonic
          path: samples/*.mp3

  melo:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: 설치
        run: |
          pip install soundfile numpy
          pip install git+https://github.com/myshell-ai/MeloTTS.git
          python -m unidic download
      - name: 샘플 만들기
        run: python scripts/tts/samples.py melo
      - name: mp3로 바꾸기
        run: |
          sudo apt-get install -y ffmpeg >/dev/null
          for f in samples/*.wav; do ffmpeg -loglevel error -y -i "$f" -b:a 128k "${f%.wav}.mp3"; done
      - uses: actions/upload-artifact@v4
        with:
          name: melo
          path: samples/*.mp3

  release:
    needs: [supertonic, melo]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - name: 파일 모으기
        run: mkdir -p all && find out -name "*.mp3" -exec cp {} all/ \; && ls -la all
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: tts-samples
          name: 음성 샘플 (고품질 음성 고르기)
          body: |
            파일마다 같은 문장을 다른 목소리로 읽어요.
            1) 구천팔백십 원  2) 삼천오십 원  3) 사백만 오백 원  4) 십이만 팔천 원
            5) 커피는 사천 원이고, 빵은 이천 원이에요. 빵은 얼마예요?  6) 칠 곱하기 팔
            마지막 두 개는 앱처럼 조각을 이어 붙인 버전이에요 (9,810원 / 커피는 4,000원이에요).
          files: all/*.mp3
          make_latest: false
