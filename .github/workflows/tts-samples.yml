name: 음성 샘플 만들기

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  supertonic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 설치
        run: pip install supertonic soundfile numpy
      - name: 샘플 만들기
        run: python scripts/tts/samples.py natural
      - name: mp3로 바꾸기
        run: |
          sudo apt-get install -y ffmpeg >/dev/null
          for f in samples/*.wav; do ffmpeg -loglevel error -y -i "$f" -b:a 128k "${f%.wav}.mp3"; done
      - uses: actions/upload-artifact@v4
        with:
          name: supertonic
          path: samples/*.mp3

  melo:
    if: false
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: 설치
        run: |
          pip install soundfile numpy
          pip install git+https://github.com/myshell-ai/MeloTTS.git
          python -m unidic download
      - name: 샘플 만들기
        run: python scripts/tts/samples.py melo
      - name: mp3로 바꾸기
        run: |
          sudo apt-get install -y ffmpeg >/dev/null
          for f in samples/*.wav; do ffmpeg -loglevel error -y -i "$f" -b:a 128k "${f%.wav}.mp3"; done
      - uses: actions/upload-artifact@v4
        with:
          name: melo
          path: samples/*.mp3

  release:
    needs: [supertonic, melo]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - name: 파일 모으기
        run: mkdir -p all && find out -name "*.mp3" -exec cp {} all/ \; && ls -la all
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: tts-samples-natural
          name: 음성 샘플 3 (금액 끊어 읽기)
          body: |
            F1·F3 목소리를 0.75 / 0.85 / 1.00배 속도로.
            1) 구천팔백십 원  2) 사백만 오백 원  3) 커피는 사천 원이고, 빵은 이천 원이에요. 빵은 얼마예요?
            4) 칠 곱하기 팔 (통째로)  5) 칠 / 곱하기 / 팔 (조각을 쉬면서 이어 붙임)
          files: all/*.mp3
          make_latest: false
