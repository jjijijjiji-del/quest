name: 음성 팩 고치기

# 검사에서 실패했던 소리만: 더 정확한 음성 인식(large-v3)으로 다시 들어 보고, 그래도 틀리면 다시 만들어 덮어씀
on:
  workflow_dispatch:
    inputs:
      list:
        description: "실패 목록 파일 이름 (voice-pack 릴리스)"
        default: voice-check-failures.json

permissions:
  contents: write

jobs:
  part:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        k: [0, 1, 2, 3]
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 설치
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          pip install supertonic faster-whisper soundfile numpy
      - name: 지금 음성 팩 받기
        run: |
          gh release download voice-pack -R ${{ github.repository }} -p voice-pack.zip -p ${{ inputs.list }} -D old
          cd old && unzip -q voice-pack.zip && rm voice-pack.zip
      - name: 다시 듣고, 틀린 것만 다시 만들기
        run: python scripts/tts/gen_pack.py fixed repair old/${{ inputs.list }} ${{ matrix.k }} 4 old/voice
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fix-${{ matrix.k }}
          path: |
            fixed
            report

  pack:
    needs: part
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: parts
          pattern: fix-*
      - name: 덮어쓰기
        run: |
          gh release download voice-pack -R ${{ github.repository }} -p voice-pack.zip -D .
          unzip -q voice-pack.zip && rm voice-pack.zip
          mkdir -p report
          for d in parts/fix-*; do [ -d $d/fixed ] && cp -r $d/fixed/. voice/; cp -r $d/report/. report/; done
          python3 - <<'PY'
          import json,glob
          rs=[r for f in glob.glob("report/*.json") for r in json.load(open(f))]
          bad=[r for r in rs if not r["ok"]]
          print(f"::notice::고친 대상 {len(rs)}개 중 다시 들어 맞은 것 {sum(r['ok'] and r['tries']==0 for r in rs)}개, 다시 만들어 맞은 것 {sum(r['ok'] and r['tries']>0 for r in rs)}개, 여전히 실패 {len(bad)}개")
          for r in bad: print("FAIL", r["name"], "|", r["text"], "→", r["heard"])
          json.dump(bad,open("voice-check-failures.json","w"),ensure_ascii=False,indent=1)
          PY
          find voice -name "*.ogg" | wc -l
          zip -qr voice-pack.zip voice
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: voice-pack
          files: |
            voice-pack.zip
            voice-check-failures.json
          make_latest: false
